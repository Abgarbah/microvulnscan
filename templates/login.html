<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ app_name }} | Login</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f7fb;
      color: #102a43;
    }
    .wrap {
      max-width: 420px;
      margin: 80px auto;
      background: #fff;
      border: 1px solid #d9e2ec;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(10, 40, 80, 0.08);
    }
    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input {
      width: 100%;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      margin-top: 14px;
      width: 100%;
      background: #0a9396;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .msg {
      margin-top: 10px;
      border: 1px solid #e7b9c2;
      background: #fff4f6;
      color: #b00020;
      border-radius: 8px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>{{ app_name }}</h1>
    <p>Sign in to start scans and access reports.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="msg">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('login') }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />

      <button type="submit">Sign In</button>
    </form>
    <p style="margin-top: 12px;">
      No account? <a href="{{ url_for('signup') }}">Create one</a>
    </p>
  </div>
</body>
</html>
